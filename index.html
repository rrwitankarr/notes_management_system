<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f4f0;
            color: #1a1a18;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 2rem;
        }

        .app-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #ddeeff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .app-icon svg {
            width: 20px;
            height: 20px;
            stroke: #185fa5;
        }

        .app-header h1 {
            font-size: 20px;
            font-weight: 500;
            color: #1a1a18;
            line-height: 1.2;
        }

        .app-header p {
            font-size: 13px;
            color: #888780;
            margin-top: 2px;
        }

        /* Cards */
        .card {
            background: #ffffff;
            border: 0.5px solid rgba(0, 0, 0, 0.12);
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.25rem;
        }

        .card-label {
            font-size: 13px;
            font-weight: 500;
            color: #888780;
            margin-bottom: 10px;
        }

        /* Textarea */
        textarea[name="note"] {
            width: 100%;
            resize: vertical;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.6;
            color: #1a1a18;
            background: #f5f4f0;
            border: 0.5px solid rgba(0, 0, 0, 0.12);
            border-radius: 8px;
            padding: 12px 14px;
            outline: none;
            transition: border-color 0.15s;
            display: block;
            margin-bottom: 12px;
        }

        textarea[name="note"]::placeholder {
            color: #b4b2a9;
        }

        textarea[name="note"]:focus {
            border-color: rgba(24, 95, 165, 0.45);
        }

        /* Buttons */
        .btn-save {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #185fa5;
            background: #ddeeff;
            border: 0.5px solid rgba(24, 95, 165, 0.3);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            float: right;
        }

        .btn-save:hover {
            background: #c5ddf7;
        }

        .btn-retrieve {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 500;
            color: #1a1a18;
            background: transparent;
            border: 0.5px solid rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-retrieve:hover {
            background: #f5f4f0;
        }

        /* Notes section header row */
        .section-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .section-divider {
            border: none;
            border-top: 0.5px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 14px;
        }

        /* Note items (used by GetNotesServlet output) */
        .note-item {
            background: #f5f4f0;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .note-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .note-id {
            font-size: 11px;
            font-weight: 500;
            color: #185fa5;
            background: #ddeeff;
            padding: 2px 8px;
            border-radius: 99px;
        }

        .note-date {
            font-size: 11px;
            color: #b4b2a9;
        }

        .note-content {
            font-size: 14px;
            color: #1a1a18;
            line-height: 1.6;
        }

        /* Success / response text from SaveNoteServlet */
        .response-msg {
            font-size: 14px;
            color: #3b6d11;
            background: #eaf3de;
            border: 0.5px solid rgba(59, 109, 17, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 1rem;
        }

        /* Clearfix */
        .save-row::after {
            content: "";
            display: table;
            clear: both;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="app-header">
        <div class="app-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
        </div>
        <div>
            <h1>My Notes</h1>
            <p>Write. Save. Revisit.</p>
        </div>
    </div>

    <!-- Write Note Card -->
    <div class="card">
        <p class="card-label">New note</p>
        <form action="saveNote" method="post">
            <textarea name="note" rows="5" placeholder="Start writing your note here…"></textarea>
            <div class="save-row">
                <button type="submit" class="btn-save">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Save note
                </button>
            </div>
        </form>
    </div>

    <!-- Retrieve Notes Card -->
    <div class="card">
        <div class="section-row">
            <p class="card-label" style="margin-bottom:0;">Saved notes</p>
            <form action="getNotes" method="get">
                <button type="submit" class="btn-retrieve">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"/>
                        <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
                    </svg>
                    Retrieve notes
                </button>
            </form>
        </div>
        <hr class="section-divider">

        <!--
            Notes rendered by GetNotesServlet will appear below.
            To style them, wrap each note block in your servlet output like:

            <div class="note-item">
                <div class="note-meta">
                    <span class="note-id">ID 1</span>
                    <span class="note-date">2025-06-01 09:41:00</span>
                </div>
                <p class="note-content">Note text here...</p>
            </div>
        -->

    </div>

</div>

</body>
</html>
